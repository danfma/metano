name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview without publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write # npm + NuGet Trusted Publishing (OIDC)
  pull-requests: write
  issues: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-dotnet@v5
        with:
          # The SDK pinned in global.json (11.0.100 GA) builds everything; the
          # 10.0.x SDK brings the net10 runtime the tools, tests and CSharpier run on.
          global-json-file: global.json
          dotnet-version: "10.0.x"

      # Trusted Publishing requires npm >= 11.5.1 (Node 24+).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: oven-sh/setup-bun@v2

      - name: Install npm dependencies
        run: bun install

      # Gate the whole release on a consumable runtime package. Runs before
      # semantic-release because that step tags, pushes and publishes to NuGet;
      # a failure later would leave a half-published release. It also runs on
      # dry runs (#249).
      - name: Smoke-test packed metano-runtime
        run: bash scripts/smoke-test-runtime-package.sh

      # Same gate for the NuGet build package: packs Metano-packages.slnx into a
      # throw-away local feed (nothing is pushed) and builds a consumer through
      # PackageReference Metano.Build.TypeScript (baseline FR-087, #328).
      - name: Cache build-package smoke NuGet downloads
        uses: actions/cache@v4
        with:
          path: obj/build-package-smoke-cache/http
          key: build-smoke-nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: build-smoke-nuget-${{ runner.os }}-

      - name: Smoke-test packed Metano.Build.TypeScript
        run: |
          bash scripts/test-build-package-smoke.sh
          bash scripts/smoke-test-build-package.sh

      # The tree-shaking gates of spec 011 FR-043, before anything is tagged:
      # the runtime's side-effect and size-budget suites, and the golden bundle
      # check of the TUnit suite. Gate-only: they publish nothing.
      - name: metano-runtime tree-shaking suites
        run: cd targets/js/metano-runtime && bun run build && bun test test/tree-shaking

      - name: Golden bundle check
        run: dotnet run --project tests/Metano.Tests/ -- --treenode-filter "/*/*/ExpectedOutputBundleTests/*"

      # The 64-bit reference conformance (spec 012 FR-064): the transpiled twin
      # must match the .NET fixtures under bun and Node before anything ships.
      - name: sample-int64-conformance
        run: |
          (cd targets/js/metano-runtime && bun run build)
          cd targets/js/sample-int64-conformance && bun run build && bun test && bun run test:node

      # Exchange the workflow's OIDC token for a short-lived NuGet API key
      # (NuGet Trusted Publishing) — replaces the long-lived NUGET_TOKEN secret.
      # Requires a trusted-publishing policy on nuget.org for user `danfma`
      # covering every package ID in Metano-packages.slnx. Skipped on dry runs,
      # where semantic-release never reaches the dotnet nuget push step.
      - name: NuGet login (OIDC → temporary API key)
        id: nuget_login
        if: ${{ inputs.dry_run != true && inputs.dry_run != 'true' }}
        uses: NuGet/login@v1
        with:
          user: danfma

      # The smoke tests above build the repository with an isolated NuGet home. Stop
      # any build server they left running and drop their restore outputs, so the
      # pack inside semantic-release restores against the runner's own package
      # folder (a stale node or obj/ caused NETSDK1152 on the 3.2.0 release).
      - name: Reset build state before packing
        run: |
          dotnet build-server shutdown
          git clean -fdX -- src

      # semantic-release: analyze commits → bump version → write CHANGELOG.md →
      # commit + tag + push → exec `dotnet pack && dotnet nuget push` → create
      # GitHub Release with notes generated from the commit log.
      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            bunx semantic-release --dry-run
          else
            bunx semantic-release
          fi

      # Resolve the new tag semantic-release just pushed so the npm publish
      # step picks up the right version. Skipped on dry runs.
      - name: Resolve published tag
        if: ${{ inputs.dry_run != true && inputs.dry_run != 'true' }}
        id: tag
        run: |
          git fetch --tags
          TAG=$(git describe --tags --abbrev=0)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build metano-runtime
        if: ${{ inputs.dry_run != true && inputs.dry_run != 'true' }}
        run: cd targets/js/metano-runtime && bun run build

      # Sync npm package version to the tag and publish via npm Trusted
      # Publishing (OIDC). No NPM_TOKEN — the npm CLI picks up the
      # id-token: write OIDC token from the workflow.
      - name: Publish metano-runtime to npm
        if: ${{ inputs.dry_run != true && inputs.dry_run != 'true' }}
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: bash scripts/sync-npm-version.sh
