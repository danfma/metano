name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  dotnet:
    name: .NET Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - uses: oven-sh/setup-bun@v2

      - name: Restore tools
        run: dotnet tool restore

      - name: Install JS dependencies
        run: bun install

      - name: Build
        run: dotnet build Metano.slnx -maxcpucount:1

      - name: Verify samples are regenerated cleanly
        run: |
          if ! git diff --quiet -- targets/ 2>&1; then
            echo "Generated TS files are out of sync with the C# source."
            echo "Run 'dotnet build' locally and commit. The build target already invokes 'bunx biome check --write' on each transpiled output dir."
            git status -- targets/
            git diff -- targets/ | head -100
            exit 1
          fi

      - name: Test
        run: dotnet run --project tests/Metano.Tests/

      - name: Format check
        run: dotnet csharpier check .

  js:
    name: JS Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      # Node runs the metano-runtime packaging smoke test (same major as release).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install

      - name: metano-runtime
        run: cd targets/js/metano-runtime && bun run build && bun test

      # Packs metano-runtime and loads the tarball from plain Node ESM +
      # NodeNext TypeScript, the way npm consumers see it (#249).
      - name: metano-runtime packaging smoke test
        run: bash scripts/smoke-test-runtime-package.sh

      - name: sample-todo
        run: cd targets/js/sample-todo && bun run build && bun test

      - name: sample-todo-service
        run: cd targets/js/sample-todo-service && bun run build && bun test

      - name: sample-issue-tracker
        run: cd targets/js/sample-issue-tracker && bun run build && bun test && bun run test:node

      - name: overload-behavior
        run: cd targets/js/overload-behavior && bun install --frozen-lockfile && bun test

      - name: sample-json-contracts
        run: cd targets/js/sample-json-contracts && bun run build && bun test

      # The 64-bit reference conformance (spec 012 FR-064): the transpiled twin
      # against the .NET fixtures, under bun and once under Node, which does
      # not hide load-order issues the way bun does.
      - name: sample-int64-conformance
        run: cd targets/js/sample-int64-conformance && bun run build && bun test && bun run test:node

      # Every other sample must at least build, so a tsconfig or hand-written
      # provider regression cannot go unnoticed (#678).
      - name: Sample builds
        run: |
          for sample in hello-world sample-counter-v1 sample-counter-v2 sample-counter-v3 \
            sample-counter-v4 sample-counter-v5 sample-solid-ui sample-operator-overloading \
            sample-queryable-arrays sample-queryable-sqlite; do
            echo "::group::$sample"
            (cd "targets/js/$sample" && bun run build)
            echo "::endgroup::"
          done

      - name: sample-queryable-sqlite
        run: cd targets/js/sample-queryable-sqlite && bun test

      - name: Biome check
        run: bunx biome check .
