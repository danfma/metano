name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  dotnet:
    name: .NET Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - uses: oven-sh/setup-bun@v2

      - name: Restore tools
        run: dotnet tool restore

      - name: Install JS dependencies
        run: bun install

      - name: Build
        run: dotnet build Metano.slnx -maxcpucount:1

      - name: Verify samples are regenerated cleanly
        run: |
          if ! git diff --quiet -- targets/ 2>&1; then
            echo "Generated TS files are out of sync with the C# source."
            echo "Run 'dotnet build' locally and commit. The build target already invokes 'bunx biome check --write' on each transpiled output dir."
            git status -- targets/
            git diff -- targets/ | head -100
            exit 1
          fi

      - name: Test
        run: dotnet run --project tests/Metano.Tests/

      - name: Format check
        run: dotnet csharpier check .

  js:
    name: JS Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      # Node runs the metano-runtime packaging smoke test (same major as release).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install

      - name: metano-runtime
        run: cd targets/js/metano-runtime && bun run build && bun test

      # Packs metano-runtime and loads the tarball from plain Node ESM +
      # NodeNext TypeScript, the way npm consumers see it (#249).
      - name: metano-runtime packaging smoke test
        run: bash scripts/smoke-test-runtime-package.sh

      - name: sample-todo
        run: cd targets/js/sample-todo && bun run build && bun test

      - name: sample-todo-service
        run: cd targets/js/sample-todo-service && bun run build && bun test

      - name: sample-issue-tracker
        run: cd targets/js/sample-issue-tracker && bun run build && bun test

      - name: Biome check
        run: bunx biome check .
